services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wechat_deliver
      POSTGRES_USER: wechat_deliver
      POSTGRES_PASSWORD: change-me-before-production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
